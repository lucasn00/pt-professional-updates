name: PT Professional Updates Bot

on:
  schedule:
    # Every Monday at 7:00 AM CST (13:00 UTC)
    - cron: "0 13 * * 1"
  workflow_dispatch:   # Allows manual trigger from the GitHub Actions tab

jobs:
  send-pt-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run PT Updates bot
        env:
          TELEGRAM_BOT_TOKEN_PT: ${{ secrets.TELEGRAM_BOT_TOKEN_PT }}
          TELEGRAM_CHAT_ID_PT: ${{ secrets.TELEGRAM_CHAT_ID_PT }}
        run: python pt_updates.py
